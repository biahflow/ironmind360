name: ironmind360

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  networks:
    - ironmind_internal
  restart: unless-stopped

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo_data:/data/db
    networks:
      - ironmind_internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ironmind_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ironmind-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-only-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ironmind_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ironmind-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-ironmind360}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - ironmind_internal
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    networks:
      - ironmind_internal
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seed:
    <<: *backend
    command: ["python", "scripts/seed.py"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery.celery_app inspect ping --destination celery@$${HOSTNAME} | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ml:
    build:
      context: ./ml
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "${ML_PORT:-8100}:8100"
    volumes:
      - ml_models:/app/models
    networks:
      - ironmind_internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend-web:
    image: node:22-alpine
    profiles: ["web"]
    working_dir: /app
    command: ["sh", "-c", "corepack enable && yarn install --frozen-lockfile && yarn web --non-interactive"]
    environment:
      EXPO_PUBLIC_BACKEND_URL: ${EXPO_PUBLIC_BACKEND_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8081:8081"
    networks:
      - ironmind_internal
    depends_on:
      api:
        condition: service_healthy

networks:
  ironmind_internal:
    name: ironmind360_internal
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  ml_models:
